<text x="1179.6" y="320.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="1162,214,323,252">Core always, Default unless unchecked,</text>
<text x="1179.6" y="341.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="1162,214,323,252">Optional only when checked; template code</text>
<text x="1179.6" y="362.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="1162,214,323,252">is copied as written</text>
