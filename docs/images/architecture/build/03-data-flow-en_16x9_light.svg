<text x="106.0" y="180.0" data-box="48,140,1824,350"><tspan font-size="21" font-weight="800" fill="#232F3E" letter-spacing="0.2">One /init-project run</tspan><tspan font-size="15" font-weight="700" fill="#5F6B7A" dx="14">detect, ask once, generate, check</tspan></text>
<rect x="72.0" y="214.0" width="323.2" height="252.0" rx="12.0" fill="#FFFFFF" stroke="#0972D3" stroke-width="1.4"/>
