<text x="453.2" y="320.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="435,214,323,252">Reads manifests and directories for the</text>
<text x="453.2" y="341.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="435,214,323,252">language, commands, layout, and git state,</text>
<text x="453.2" y="362.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="435,214,323,252">with no build or install</text>
<rect x="453.2" y="424.0" width="126.9" height="24.0" rx="12.0" fill="#2E8CF0" fill-opacity="0.140" stroke="#0972D3" stroke-width="1.1"/>
<text x="516.6" y="440.3" font-size="12" font-weight="800" fill="#0972D3" text-anchor="middle" data-box="435,214,323,252">no build, no install</text>
