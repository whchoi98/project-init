<text x="816.4" y="320.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="798,214,323,252">One round covers reference layers,</text>
<text x="816.4" y="341.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="798,214,323,252">components by tier, README fields, and</text>
<text x="816.4" y="362.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="798,214,323,252">git; unknowns become TODO markers</text>
<rect x="816.4" y="424.0" width="89.2" height="24.0" rx="12.0" fill="#8C4FFF" fill-opacity="0.140" stroke="#7D3FE0" stroke-width="1.1"/>
<text x="861.0" y="440.3" font-size="12" font-weight="800" fill="#7D3FE0" text-anchor="middle" data-box="798,214,323,252">layers, tiers</text>
