<text x="90.0" y="276.0" font-size="18" font-weight="700" fill="#232F3E" font-family="D2Coding, 'D2Coding ligature', Menlo, Consolas, monospace" data-box="72,214,323,252">/init-project</text>
<line x1="90.0" y1="292.0" x2="377.2" y2="292.0" stroke="#DFE4EA" stroke-width="1.2" stroke-linecap="round"/>
<text x="90.0" y="320.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="72,214,323,252">The user starts it in the project root; a</text>
<text x="90.0" y="341.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="72,214,323,252">second run is safe, because existing files</text>
<text x="90.0" y="362.0" font-size="14" font-weight="700" fill="#2E3A4A" data-box="72,214,323,252">win</text>
